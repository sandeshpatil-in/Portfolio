[build]
  publish = "."

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/resume"
  to = "/resume.html"
  status = 301

[[redirects]]
  from = "/portfolio"
  to = "/portfolio.html"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/blog/wordcamp-kolhapur-2026"
  to = "/wordcamp-kolhapur-2026.html"
  status = 301

[[redirects]]
  from = "/blog/domain-vs-hosting-beginner-guide"
  to = "/domain-vs-hosting-beginner-guide.html"
  status = 301

[[redirects]]
  from = "/wordpress-developer-pune"
  to = "/wordpress-developer-pune.html"
  status = 301

[[redirects]]
  from = "/wordpress-developer-kolhapur"
  to = "/wordpress-developer-kolhapur.html"
  status = 301

[[redirects]]
  from = "/wordpress-developer-sangli"
  to = "/wordpress-developer-sangli.html"
  status = 301

[[redirects]]
  from = "/wordpress-developer-satara"
  to = "/wordpress-developer-satara.html"
  status = 301

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/partials/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
